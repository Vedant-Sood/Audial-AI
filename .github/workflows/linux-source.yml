name: Linux source validation

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      ACCESSIBILITY_AI_HOME: ${{ github.workspace }}/ci-state
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-cloud.lock
            requirements-dev.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install the CPU source runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libegl1 libopengl0 libgl1 libpulse0
          python -m pip install 'torch==2.8.0+cpu' 'torchaudio==2.8.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-cloud.lock -r requirements-dev.txt
          python -m pip check
      - name: Python, JavaScript and desktop regressions
        run: |
          python -m pytest -q --junitxml=artifacts/source-validation/python-tests.xml
          npm test
          python -m app.main --smoke-test
      - name: Real Chromium voice-view integration
        run: |
          python -m playwright install --with-deps chromium
          browser_path="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python -m scripts.verify_sanket --browser "$browser_path" --output artifacts/source-validation/sanket
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: Linux-source-validation
          path: artifacts/source-validation/
          retention-days: 14
