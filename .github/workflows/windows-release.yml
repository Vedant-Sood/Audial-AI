name: Windows installers and acceptance
on:
  push:
    branches: [main, 'codex/audial-desktop-upgrade']
    tags: ['v*', 'kandha-v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        runtime: [CPU, NVIDIA]
    env:
      QT_QPA_PLATFORM: offscreen
      ACCESSIBILITY_AI_HOME: ${{ github.workspace }}\ci-state
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_XET: '1'
      PYANNOTE_METRICS_ENABLED: '0'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Isolate build dependencies from runner tools
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw 'Cannot create the build virtual environment' }
          "$env:GITHUB_WORKSPACE\.venv\Scripts" | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - name: Install compatible native runtime
        shell: pwsh
        run: |
          $index = if ('${{ matrix.runtime }}' -eq 'NVIDIA') { 'cu126' } else { 'cpu' }
          python -m pip install torch==2.8.0 torchaudio==2.8.0 --index-url "https://download.pytorch.org/whl/$index" 2>&1 | Tee-Object windows-torch-install.txt
          if ($LASTEXITCODE -ne 0) { throw 'PyTorch runtime installation failed' }
          python -m pip install -r requirements.txt -r requirements-overlap.txt -r requirements-build.txt -r requirements-dev.txt 2>&1 | Tee-Object windows-dependencies-install.txt
          if ($LASTEXITCODE -ne 0) { throw 'Application dependencies failed' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Dependency conflict' }
          python -m pip freeze | Set-Content windows-resolved-dependencies.txt
          python -m pip cache purge
          python -c "from pyannote.audio.core.io import Audio; import torch; x,sr=Audio(sample_rate=16000)({'waveform':torch.zeros(1,16000),'sample_rate':16000}); assert x.shape == (1,16000)"
          if ($LASTEXITCODE -ne 0) { throw 'Community-1 waveform runtime failed' }
          python -c "import importlib.metadata as m, bleak.backends.winrt.client, bleak.backends.winrt.scanner; print('bleak', m.version('bleak'), 'with WinRT backend')"
          if ($LASTEXITCODE -ne 0) { throw 'Kandha Stole Bluetooth link (bleak with its WinRT backend) is not installed' }
      - name: Regression and source startup
        id: regression
        shell: pwsh
        run: |
          python -m pytest -q --junitxml=windows-tests.xml 2>&1 | Tee-Object windows-tests.txt
          if ($LASTEXITCODE -ne 0) { throw 'Windows regression failed' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Browser regressions failed' }
          python -m app.main --smoke-test 2>&1 | Tee-Object windows-source-startup.txt
          if ($LASTEXITCODE -ne 0) { throw 'Source native UI failed' }
          $env:QTWEBENGINE_CHROMIUM_FLAGS = '--disable-gpu --no-sandbox'
          python -m app.main --kandha-check 2>&1 | Tee-Object windows-source-kandha.txt
          if ($LASTEXITCODE -ne 0) { throw 'Source Kandha page did not become ready in QtWebEngine' }
      - name: Build versioned Setup.exe and checksums
        id: build_installer
        shell: pwsh
        run: |
          ./scripts/build_windows.ps1 -Runtime '${{ matrix.runtime }}' 2>&1 | Tee-Object windows-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          $version = python -c 'from app import __version__; print(__version__)'
          # Same payload packaged as a newer revision exercises the installer
          # upgrade path. It does not validate a historical binary upgrade.
          ./scripts/build_windows.ps1 -Runtime '${{ matrix.runtime }}' -Version "$version.1" -PayloadDir dist/AccessibilityAI 2>&1 | Tee-Object windows-upgrade-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Upgrade fixture build failed' }
          ./scripts/build_kandha_windows.ps1 -Runtime '${{ matrix.runtime }}' 2>&1 | Tee-Object windows-kandha-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Kandha installer build failed' }
      - name: Kandha payload carries the Bluetooth link and the HTML guide
        id: kandha_payload
        if: ${{ !cancelled() && steps.build_installer.outcome == 'success' }}
        shell: pwsh
        run: |
          # bleak, its WinRT backend (pure modules in Kandha.exe, .pyd files under _internal) and their metadata.
          python packaging/kandha_bluetooth.py --payload dist/AccessibilityAI --os windows --output windows-kandha-bluetooth.json
          if ($LASTEXITCODE -ne 0) { throw 'The packaged Kandha is missing bleak or its WinRT backend' }
          if (-not (Test-Path dist/AccessibilityAI/_internal/docs/kandha/USER_GUIDE.html)) { throw 'The packaged Kandha has no HTML user guide' }
      - name: Actual extension/native capture in Chrome for Testing
        id: chrome_acceptance
        if: ${{ !cancelled() && steps.build_installer.outcome == 'success' && matrix.runtime == 'CPU' }}
        shell: pwsh
        run: |
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Chrome for Testing installation failed' }
          $browser = python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()'
          python -m scripts.verify_browser --browser "$browser" --native-host dist/AccessibilityAI/AccessibilityAIWorker.exe --output windows-browser-chromium 2>&1 | Tee-Object windows-browser-chromium.txt
          if ($LASTEXITCODE -ne 0) { throw 'Chrome for Testing tab capture failed' }
      - name: Actual extension/native capture in Microsoft Edge
        id: edge_acceptance
        if: ${{ !cancelled() && steps.build_installer.outcome == 'success' && matrix.runtime == 'CPU' }}
        env:
          DEBUG: pw:browser
        shell: pwsh
        run: |
          ./scripts/prepare_edge_ci.ps1 -Output windows-browser-edge/edge-runtime.json
          $edge = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          if (-not (Test-Path $edge)) { throw 'Microsoft Edge is missing from the Windows runner' }
          python -m scripts.verify_browser --browser "$edge" --native-host dist/AccessibilityAI/AccessibilityAIWorker.exe --output windows-browser-edge 2>&1 | Tee-Object windows-browser-edge.txt
          if ($LASTEXITCODE -ne 0) {
            python -m scripts.diagnose_browser_discard --browser "$edge" --output windows-browser-edge/minimal-discard.json 2>&1 | Tee-Object windows-browser-edge/minimal-discard.txt
            throw 'Microsoft Edge tab capture failed; isolated discard diagnostics are retained'
          }
      - name: Actual installed Windows acceptance
        id: installed_acceptance
        if: ${{ !cancelled() && steps.build_installer.outcome == 'success' }}
        shell: pwsh
        run: |
          $version = python -c 'from app import __version__; print(__version__)'
          ./scripts/verify_windows.ps1 -Installer "dist/installers/Audial-AI-$version-Windows-x64-${{ matrix.runtime }}-Setup.exe" -UpgradeInstaller "dist/installers/Audial-AI-$version.1-Windows-x64-${{ matrix.runtime }}-Setup.exe" 2>&1 | Tee-Object windows-acceptance.txt
          if ($LASTEXITCODE -ne 0) { throw 'Installed Windows acceptance failed' }
          foreach ($file in @('windows-acceptance/installer-acceptance.json', 'windows-acceptance/installed-offline-inference.txt', 'windows-acceptance/installed-streaming-inference.txt')) {
            $report = Get-Content $file -Raw | ConvertFrom-Json | ConvertTo-Json -Depth 12 -Compress
            Write-Output ('::notice title=Installed Windows acceptance::' + $report.Replace('%', '%25').Replace([string][char]13, '%0D').Replace([string][char]10, '%0A'))
          }
      - name: Actual installed Kandha acceptance
        id: kandha_acceptance
        if: ${{ !cancelled() && steps.installed_acceptance.outcome == 'success' }}
        shell: pwsh
        run: |
          $version = python -c 'from app import __version__; print(__version__)'
          ./scripts/verify_kandha_windows.ps1 -Installer "dist/installers/Kandha-Setup-$version.exe" 2>&1 | Tee-Object windows-kandha-acceptance.txt
          if ($LASTEXITCODE -ne 0) { throw 'Installed Kandha acceptance failed' }
      - name: Stage Kandha installer and portable build
        id: stage_kandha
        if: ${{ !cancelled() && steps.regression.outcome == 'success' && steps.kandha_payload.outcome == 'success' && steps.kandha_acceptance.outcome == 'success' }}
        shell: pwsh
        run: |
          $version = python -c 'from app import __version__; print(__version__)'
          New-Item -ItemType Directory -Force dist/kandha | Out-Null
          Copy-Item "dist/installers/Kandha-Setup-$version.exe*" dist/kandha
          Copy-Item "dist/installers/Kandha-$version-windows.zip*" dist/kandha
          Copy-Item "dist/installers/Kandha-$version-windows.json" dist/kandha
          Copy-Item build/build-info.json dist/kandha
          Copy-Item windows-kandha-acceptance/kandha-acceptance.json dist/kandha
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: ${{ !cancelled() && steps.stage_kandha.outcome == 'success' }}
        with:
          name: Kandha-Windows-x64-${{ matrix.runtime }}
          path: dist/kandha/*
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
      - name: Stage installers after passed Windows lifecycle acceptance
        id: stage_installer
        if: ${{ !cancelled() && steps.regression.outcome == 'success' && steps.installed_acceptance.outcome == 'success' }}
        shell: pwsh
        run: |
          $version = python -c 'from app import __version__; print(__version__)'
          New-Item -ItemType Directory -Force dist/accepted | Out-Null
          Copy-Item "dist/installers/Audial-AI-$version-Windows-x64-${{ matrix.runtime }}-Setup.exe*" dist/accepted
          Copy-Item build/build-info.json dist/accepted
          # A browser failure remains a failed job and blocks tagged releases.
          # Preserve independently passed installer results for review/download.
          $status = [ordered]@{
            source_commit = $env:GITHUB_SHA
            runtime = '${{ matrix.runtime }}'
            regression = '${{ steps.regression.outcome }}'
            installed_lifecycle_and_inference = '${{ steps.installed_acceptance.outcome }}'
            chrome_transport = '${{ steps.chrome_acceptance.outcome }}'
            edge_transport = '${{ steps.edge_acceptance.outcome }}'
            note = 'Installer lifecycle and inference must pass before this artifact is produced. Browser failures remain failures and prevent a tagged release; see the run validation artifacts for their exact scope.'
          }
          $status | ConvertTo-Json | Set-Content dist/accepted/acceptance-status.json -Encoding utf8
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: ${{ !cancelled() && steps.stage_installer.outcome == 'success' }}
        with:
          name: Audial-AI-Windows-x64-${{ matrix.runtime }}-Setup
          path: dist/accepted/*
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
      - name: Report failure details
        if: failure()
        shell: pwsh
        run: |
          $files = @('windows-acceptance/installer-acceptance.json', 'windows-acceptance/model-summary.txt', 'windows-acceptance/startup-error.log')
          $files += @('windows-browser-chromium/extension-acceptance.json', 'windows-browser-edge/extension-acceptance.json', 'windows-browser-chromium.txt', 'windows-browser-edge.txt')
          $files += @(Get-ChildItem windows-acceptance -Filter '*errors.txt' -ErrorAction SilentlyContinue | ForEach-Object FullName)
          $files += @('windows-acceptance/installed-offline-inference.txt', 'windows-acceptance/installed-streaming-inference.txt', 'windows-acceptance.txt', 'windows-tests.txt', 'windows-build.txt')
          $files += @(Get-ChildItem windows-acceptance -Filter '*.json' -ErrorAction SilentlyContinue | ForEach-Object FullName)
          foreach ($file in $files) {
            if (Test-Path $file) {
              $excerpt = (Get-Content $file | Select-Object -Last 25) -join [Environment]::NewLine
              if (-not $excerpt.Trim()) { continue }
              $excerpt | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              $annotation = $excerpt.Replace('%', '%25').Replace([string][char]13, '%0D').Replace([string][char]10, '%0A')
              Write-Output ("::error title=" + $file + "::" + $annotation)
            }
          }
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: Windows-validation-${{ matrix.runtime }}
          path: |
            windows-torch-install.txt
            windows-dependencies-install.txt
            windows-build.txt
            windows-upgrade-build.txt
            windows-acceptance.txt
            windows-browser-chromium.txt
            windows-browser-edge.txt
            windows-tests.xml
            windows-tests.txt
            windows-source-startup.txt
            windows-source-kandha.txt
            windows-kandha-build.txt
            windows-kandha-acceptance.txt
            windows-kandha-acceptance/
            windows-kandha-bluetooth.json
            windows-resolved-dependencies.txt
            windows-acceptance/
            windows-browser-chromium/
            windows-browser-edge/
            build/build-info.json
          retention-days: 14
  firmware:
    if: startsWith(github.ref, 'refs/tags/kandha-v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python scripts/generate_kandha_patterns.py --check
      - name: Compile the stole firmware
        run: |
          curl -fsSL -o arduino-cli.tar.gz https://github.com/arduino/arduino-cli/releases/download/v1.2.2/arduino-cli_1.2.2_Linux_64bit.tar.gz
          echo "a5ad085d1b02fd4010df18b1bbf20453276efe6c6e2ac323baa0cac4e96a85b4  arduino-cli.tar.gz" | sha256sum -c -
          sudo tar -xzf arduino-cli.tar.gz -C /usr/local/bin arduino-cli
          arduino-cli version
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.1.1
          arduino-cli compile --fqbn esp32:esp32:esp32s3:CDCOnBoot=cdc --export-binaries firmware/kandha
          version=$(python -c 'from app import __version__; print(__version__)')
          mkdir -p dist/firmware
          cp firmware/kandha/build/esp32.esp32.esp32s3/*.bin dist/firmware/
          cp firmware/kandha/README.md dist/firmware/FLASHING.md
          (cd dist/firmware && sha256sum *.bin > SHA256SUMS.txt)
          (cd dist/firmware && zip -r "../kandha-stole-firmware-$version.zip" . && cd .. && sha256sum "kandha-stole-firmware-$version.zip" > "kandha-stole-firmware-$version.zip.sha256")
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: kandha-stole-firmware
          path: |
            dist/kandha-stole-firmware-*.zip
            dist/kandha-stole-firmware-*.zip.sha256
          if-no-files-found: error
  release-kandha:
    if: startsWith(github.ref, 'refs/tags/kandha-v')
    needs: [windows, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: Kandha-Windows-x64-*
          path: release-assets
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: kandha-stole-firmware
          path: release-assets/firmware
      - name: Publish the Kandha installer, portable build, firmware and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # The CPU and NVIDIA jobs build the same Kandha-Setup-<version>.exe name; publish the CPU one
          # (smaller, runs everywhere) and keep the NVIDIA installer under its runtime name.
          set -euo pipefail
          version=$(python3 -c 'from app import __version__; print(__version__)')
          cpu=release-assets/Kandha-Windows-x64-CPU
          nvidia=release-assets/Kandha-Windows-x64-NVIDIA
          # The build jobs wrote a .sha256 beside each file; the downloads must still match them.
          (cd "$cpu" && sha256sum -c "Kandha-Setup-$version.exe.sha256" "Kandha-$version-windows.zip.sha256")
          (cd release-assets/firmware && sha256sum -c kandha-stole-firmware-*.zip.sha256)
          mkdir -p publish
          cp "$cpu/Kandha-Setup-$version.exe" "$cpu/Kandha-$version-windows.zip" publish/
          if [ -f "$nvidia/Kandha-Setup-$version.exe" ]; then
            (cd "$nvidia" && sha256sum -c "Kandha-Setup-$version.exe.sha256")
            cp "$nvidia/Kandha-Setup-$version.exe" "publish/Kandha-Setup-$version-NVIDIA.exe"
          fi
          cp release-assets/firmware/kandha-stole-firmware-*.zip publish/
          cd publish
          # A <file>.sha256 beside every asset (named as published, so `sha256sum -c` works after a
          # download), plus one SHA256SUMS.txt covering them all.
          assets=(*.exe *.zip)
          for asset in "${assets[@]}"; do sha256sum "$asset" > "$asset.sha256"; done
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          sha256sum -c ./*.sha256 SHA256SUMS.txt
          for asset in "${assets[@]}"; do test -s "$asset.sha256"; done
          cat SHA256SUMS.txt
          cd ..
          gh release create "$GITHUB_REF_NAME" publish/* --title "Kandha $GITHUB_REF_NAME" --notes-file docs/kandha/RELEASE_NOTES.md
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: Audial-AI-Windows-x64-*-Setup
          path: release-assets
      - name: Publish accepted installers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -d '' installers < <(find release-assets -type f \( -name '*-Setup.exe' -o -name '*-Setup.exe.sha256' \) -print0)
          test "${#installers[@]}" -eq 4
          gh release create "$GITHUB_REF_NAME" "${installers[@]}" --title "Audial-AI $GITHUB_REF_NAME" --notes-file docs/release_notes.md
