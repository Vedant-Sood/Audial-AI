name: Windows desktop validation and release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      ACCESSIBILITY_AI_HOME: ${{ github.workspace }}\ci-state
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install CPU dependencies
        shell: pwsh
        run: |
          python -m pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements.txt -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Windows regression and startup checks
        shell: pwsh
        run: |
          python -m pytest -q --junitxml=windows-tests.xml 2>&1 | Tee-Object -FilePath windows-test-output.txt
          $regression_status = $LASTEXITCODE
          '## Windows regression tests' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```text' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Get-Content windows-test-output.txt | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($regression_status -ne 0) { exit $regression_status }
          python -m app.main --smoke-test 2>&1 | Tee-Object -FilePath windows-startup-output.txt
          $startup_status = $LASTEXITCODE
          '## Native startup check' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```text' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Get-Content windows-startup-output.txt | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($startup_status -ne 0) { exit $startup_status }
          node tests/browser.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build native executable directory
        shell: pwsh
        run: |
          python -m PyInstaller packaging/AccessibilityAI.spec --noconfirm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\dist\AccessibilityAI\AccessibilityAIWorker.exe --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist\AccessibilityAI -DestinationPath dist\AccessibilityAI-Windows-x64-native.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AccessibilityAI-Windows-x64-native
          path: |
            dist/AccessibilityAI-Windows-x64-native.zip
            windows-tests.xml
          retention-days: 30
      - name: Report Windows checks
        if: always()
        shell: pwsh
        run: |
          foreach ($report_file in @('windows-test-output.txt', 'windows-startup-output.txt')) {
            if (Test-Path $report_file) {
              ('## ' + $report_file) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              '```text' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              Get-Content $report_file | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-validation-results
          path: |
            windows-tests.xml
            windows-test-output.txt
            windows-startup-output.txt
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AccessibilityAI-Windows-x64-native
          path: release-assets
      - name: Publish the validated Windows ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact="$(find release-assets -name AccessibilityAI-Windows-x64-native.zip -type f -print -quit)"
          test -n "$artifact"
          gh release create "$GITHUB_REF_NAME" "$artifact" --title "AccessibilityAI $GITHUB_REF_NAME" --notes-file docs/release_notes.md
